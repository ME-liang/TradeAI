<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TradeAI · 板块</title>
<style>
  :root{
    --bg:#F5F5F7;          /* 页面浅灰 */
    --card:#FFFFFF;        /* 卡片白 */
    --ink:#1D1D1F;         /* 主文字 */
    --sub:#6E6E73;         /* 次要文字 */
    --muted:#86868B;       /* 辅助文字 */
    --blue:#0071E3;        /* 强调蓝 */
    --blue-soft:#EAF2FC;   /* 领涨股标签底色 */
    --blue-ink:#0071E3;    /* 领涨股标签文字 */
    --up:#D8392F;          /* 涨 红 */
    --down:#1AA05A;        /* 跌 绿 */
    --search-bg:#F5F7FA;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;justify-content:center;padding:48px 16px;
  }
  .page{
    width:100%;max-width:1200px;background:var(--card);
    border-radius:24px;padding:56px 48px;
  }
  .breadcrumb{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:8px;}
  .title{font-size:36px;font-weight:700;letter-spacing:-0.5px;}
  .subtitle{font-size:16px;color:var(--sub);margin-top:8px;}
  .typebar{display:flex;align-items:center;gap:10px;margin-top:16px;}
  .type-label{font-size:14px;color:var(--sub);font-weight:500;}
  .type-sel{
    height:44px;border-radius:12px;border:1px solid #E2E2E7;background:#fff;
    font-size:15px;color:var(--ink);padding:0 14px;font-family:inherit;cursor:pointer;
  }
  .type-sel:focus{outline:none;border-color:var(--blue);}
  .search{
    margin-top:28px;height:56px;border-radius:var(--radius);
    background:var(--search-bg);display:flex;align-items:center;gap:12px;
    padding:0 18px;border:1px solid transparent;transition:border-color .15s ease;
  }
  .search:focus-within{border-color:var(--blue);}
  .search svg{flex:0 0 auto;}
  .search input{
    flex:1;border:none;background:transparent;outline:none;
    font-size:16px;color:var(--ink);font-family:inherit;
  }
  .search input::placeholder{color:var(--muted);}
  .meta{font-size:14px;color:var(--muted);font-weight:500;margin:18px 0 14px;}
  .sortbar{display:flex;align-items:center;gap:10px;margin-top:18px;}
  .sort-label{font-size:14px;color:var(--sub);font-weight:500;}
  .sort-sel{
    height:40px;border-radius:12px;border:1px solid #E2E2E7;background:#fff;
    font-size:14px;color:var(--ink);padding:0 12px;font-family:inherit;cursor:pointer;
  }
  .sort-sel:focus{outline:none;border-color:var(--blue);}
  .mcap{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:104px;}
  .mcap .mv{font-size:16px;font-weight:700;}
  .mcap .ms{font-size:12px;color:var(--muted);}
  .list{display:flex;flex-direction:column;gap:14px;}
  .row{
    display:flex;align-items:center;gap:16px;cursor:pointer;
    background:#F5F5F7;border-radius:var(--radius);padding: 18px 24px;
    transition:background .15s ease;
  }
  .row:hover{background:#ECECEF;}
  .co{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;min-width:200px;}
  .co .name{font-size:18px;font-weight:700;}
  .co .code{font-size:13px;color:var(--muted);}
  .spacer{flex:1 1 auto;}
  .price{display:flex;align-items:baseline;gap:12px;flex:0 0 auto;}
  .price .val{font-size:18px;font-weight:700;}
  .price .chg{font-size:14px;font-weight:600;}
  .chg.up{color:var(--up);}
  .chg.down{color:var(--down);}
  .chg.flat{color:var(--muted);}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:15px;}
  .pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:28px;flex-wrap:wrap;}
  .pager button{
    min-width:38px;height:36px;padding:0 12px;border:1px solid #E2E2E7;background:#fff;color:var(--ink);
    font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;transition:all .15s ease;font-family:inherit;
  }
  .pager button:hover:not(:disabled):not(.active){border-color:var(--blue);color:var(--blue);}
  .pager button.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .pager button:disabled{opacity:.45;cursor:not-allowed;}
  .pager .page-gap{color:var(--muted);padding:0 4px;font-size:14px;}
  .pager .page-info{font-size:14px;color:var(--muted);margin:0 4px;font-weight:600;}
  /* 跳转到指定页 */
  .jump{position:relative;display:inline-flex;align-items:center;gap:6px;margin-left:10px;}
  .jump-label{font-size:14px;color:var(--muted);font-weight:500;}
  .jump-input{
    width:56px;height:36px;border:1px solid #E2E2E7;background:#fff;color:var(--ink);
    font-size:14px;font-weight:600;border-radius:10px;padding:0 8px;text-align:center;
    font-family:inherit;box-sizing:border-box;transition:border-color .15s ease;
  }
  .jump-input:focus{outline:none;border-color:var(--blue);}
  .jump-input.invalid{border-color:var(--up);}
  .jump-go{
    min-width:38px;height:36px;padding:0 12px;border:1px solid #E2E2E7;background:#fff;color:var(--ink);
    font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;transition:all .15s ease;font-family:inherit;
  }
  .jump-go:hover{border-color:var(--blue);color:var(--blue);}
  .jump-err{
    position:absolute;top:100%;left:0;margin-top:4px;white-space:nowrap;
    font-size:13px;color:var(--up);font-weight:500;
  }
  @media (max-width:480px){
    body{padding:24px 12px;}
    .page{border-radius:20px;padding:32px 20px;}
    .title{font-size:28px;}
    .row{flex-wrap:wrap;gap:10px;padding:14px 16px;}
    .co{min-width:0;flex:1 1 100%;}
    .price{order:2;margin-left:auto;}
    .spacer{display:none;}
    .mcap{order:5;align-items:flex-start;min-width:0;}
  }
</style>
</head>
<body>
  <div class="page" id="page">
    <a href="index.html" class="breadcrumb" style="display:inline-block;margin-bottom:12px;text-decoration:none;">← 返回首页</a>
    <div class="breadcrumb">TradeAI / 板块</div>
    <div class="title">板块</div>
    <div class="subtitle">行业与概念板块行情一览</div>

    <div class="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="#86868B" stroke-width="2"/>
        <path d="M20 20L16.5 16.5" stroke="#86868B" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="q" type="text" placeholder="搜索板块名称、代码或领涨股…" autocomplete="off" />
    </div>

    <div class="typebar">
      <span class="type-label">板块类型</span>
      <select id="typeSel" class="type-sel" aria-label="选择板块类型">
        <option value="industry" selected>行业板块</option>
        <option value="concept">概念板块</option>
      </select>
    </div>

    <div class="sortbar">
      <span class="sort-label">排序</span>
      <select id="sortSel" class="sort-sel">
        <option value="chg_desc">涨跌幅（高→低）</option>
        <option value="chg_asc">涨跌幅（低→高）</option>
        <option value="mcap_desc">总市值（高→低）</option>
        <option value="mcap_asc">总市值（低→高）</option>
        <option value="price_desc">点位（高→低）</option>
        <option value="price_asc">点位（低→高）</option>
      </select>
    </div>

    <div class="meta" id="meta">共 -- 个板块</div>

    <div class="list" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>

<script src="js/list_state.js"></script>
<script>
  // ===== 配置 =====
  const PER_PAGE_DEFAULT = 6;            // 每页默认 6 个, 与个股列表页一致(返回时按离开前的值恢复)
  let PER_PAGE = PER_PAGE_DEFAULT;
  const API_URL = '/api/boards_list';    // 同源后端代理(真实数据, 动态)
  const UNIT = { industry: '个', concept: '个' };

  // 降级示例数据（API 与离线数据均不可用时使用）
  const FALLBACK = {
    industry: [
      {name:"半导体",       code:"BK1036", leader:"中芯国际", leader_chg:"+3.20%", price:"5231.66", chg:"+2.41%", dir:"up",   chg_num:2.41,  up_n:112, down_n:23,  mcap:4.2e12, mcap_disp:"4.20万亿"},
      {name:"汽车整车",     code:"BK0481", leader:"赛力斯",   leader_chg:"+2.10%", price:"6894.20", chg:"+1.85%", dir:"up",   chg_num:1.85,  up_n:28,  down_n:9,   mcap:2.1e12, mcap_disp:"2.10万亿"},
      {name:"食品饮料",     code:"BK0438", leader:"贵州茅台", leader_chg:"+0.85%", price:"23180.5", chg:"+0.92%", dir:"up",   chg_num:0.92,  up_n:56,  down_n:40,  mcap:5.8e12, mcap_disp:"5.80万亿"},
      {name:"电力设备",     code:"BK1032", leader:"宁德时代", leader_chg:"+1.10%", price:"8921.30", chg:"-0.64%", dir:"down", chg_num:-0.64, up_n:44,  down_n:75,  mcap:3.9e12, mcap_disp:"3.90万亿"},
      {name:"银行",         code:"BK0475", leader:"招商银行", leader_chg:"+0.42%", price:"3185.44", chg:"-0.28%", dir:"down", chg_num:-0.28, up_n:18,  down_n:24,  mcap:9.6e12, mcap_disp:"9.60万亿"},
      {name:"医药商业",     code:"BK0440", leader:"益丰药房", leader_chg:"+1.05%", price:"2043.75", chg:"-1.36%", dir:"down", chg_num:-1.36, up_n:21,  down_n:45,  mcap:6.2e11, mcap_disp:"6200.00亿"},
    ],
    concept: [
      {name:"融资融券",     code:"BK8663", leader:"东方财富", leader_chg:"+1.60%", price:"1024.55", chg:"+0.88%", dir:"up",   chg_num:0.88,  up_n:620, down_n:410, mcap:1.8e13, mcap_disp:"18.00万亿"},
      {name:"沪股通",       code:"BK8661", leader:"招商银行", leader_chg:"+0.42%", price:"986.32",  chg:"+0.35%", dir:"up",   chg_num:0.35,  up_n:510, down_n:320, mcap:1.5e13, mcap_disp:"15.00万亿"},
      {name:"人工智能",     code:"BK0800", leader:"科大讯飞", leader_chg:"+4.10%", price:"3125.80", chg:"+2.96%", dir:"up",   chg_num:2.96,  up_n:180, down_n:64,  mcap:6.4e12, mcap_disp:"6.40万亿"},
      {name:"国企改革",     code:"BK8662", leader:"中国中免", leader_chg:"+0.75%", price:"2145.10", chg:"-0.22%", dir:"down", chg_num:-0.22, up_n:388, down_n:412, mcap:1.2e13, mcap_disp:"12.00万亿"},
      {name:"锂电池",       code:"BK0827", leader:"宁德时代", leader_chg:"+1.10%", price:"4520.65", chg:"-0.95%", dir:"down", chg_num:-0.95, up_n:96,  down_n:172, mcap:5.1e12, mcap_disp:"5.10万亿"},
      {name:"光伏概念",     code:"BK0900", leader:"隆基绿能", leader_chg:"-0.60%", price:"3321.40", chg:"-1.72%", dir:"down", chg_num:-1.72, up_n:74,  down_n:158, mcap:3.3e12, mcap_disp:"3.30万亿"},
    ],
  };

  const list = document.getElementById('list');
  const meta = document.getElementById('meta');
  const q = document.getElementById('q');
  const pager = document.getElementById('pager');
  const sortSel = document.getElementById('sortSel');
  const typeSel = document.getElementById('typeSel');

  const state = { type:'industry', sort:'chg_desc', order:'desc', page:1, q:'' };  // 板块类型默认行业板块
  let mode = 'api';          // 'api' | 'fallback'
  let fallbackAll = null;    // 兜底数据(加载失败时退回内置 FALLBACK)

  // ===== 列表状态保持 =====
  // 从板块详情返回时恢复类型/页码/每页条数/关键词/排序/滚动位置; 从菜单、搜索等
  // 其它入口进入时 ListState.load 返回 null, 保持默认第 1 页(见 js/list_state.js)。
  const RESTORE = (window.ListState && ListState.load('sector')) || null;
  let scrollRestored = false;
  if(RESTORE){
    if(RESTORE.type === 'industry' || RESTORE.type === 'concept') state.type = RESTORE.type;
    if(RESTORE.sort) state.sort = RESTORE.sort;
    if(RESTORE.order) state.order = RESTORE.order;
    if(RESTORE.page) state.page = RESTORE.page;
    if(typeof RESTORE.q === 'string') state.q = RESTORE.q;
    const ps = Number(RESTORE.pageSize);
    if(ps >= 1 && ps <= 100) PER_PAGE = ps;
    if(typeSel) typeSel.value = state.type;       // UI 与恢复后的状态保持一致
    if(sortSel) sortSel.value = state.sort;
    if(q) q.value = state.q;
    ListState.cleanUrl();
  }
  function snapshot(){
    return { type: state.type, sort: state.sort, order: state.order, page: state.page,
             q: state.q, pageSize: PER_PAGE, scrollY: window.scrollY };
  }
  function saveListState(){ if(window.ListState) ListState.save('sector', snapshot()); }
  // 兜底保存: 任何离开本页的导航(含浏览器后退/前进)都能带上最新状态
  window.addEventListener('pagehide', saveListState);
  function restoreScrollOnce(){
    if(scrollRestored || !RESTORE) return;
    scrollRestored = true;
    ListState.restoreScroll(RESTORE.scrollY);
  }

  function filtered(){
    const kw = state.q.trim().toLowerCase();
    const src = (fallbackAll && fallbackAll[state.type]) || [];
    if(!kw) return src;
    return src.filter(d =>
      d.name.toLowerCase().includes(kw) ||
      d.code.toLowerCase().includes(kw) ||
      (d.leader || '').toLowerCase().includes(kw)
    );
  }

  // ===== 排序（兜底模式用, 先排序、后分页） =====
  function cmpNum(x, y, desc){
    const xn = (x == null), yn = (y == null);
    if(xn && yn) return 0;
    if(xn) return 1;     // 缺失值恒排末尾
    if(yn) return -1;
    const d = x - y;
    return desc ? -d : d;
  }
  function valOf(d, key){
    if(key === 'chg') return d.chg_num;
    if(key === 'price') return parseFloat(d.price) || null;
    if(key === 'mcap') return d.mcap;
    return null;
  }
  function applySort(arr){
    const key = state.sort.split('_')[0];
    const desc = state.order === 'desc';
    return arr.slice().sort((a,b) => cmpNum(valOf(a,key), valOf(b,key), desc));
  }

  function buildRow(d){
    const row = document.createElement('div');
    row.className = 'row';
    const upn = (d.up_n == null) ? '--' : d.up_n;
    const dwn = (d.down_n == null) ? '--' : d.down_n;
    row.innerHTML =
      '<div class="co"><div class="name">'+d.name+'</div><div class="code">'+d.code+'</div></div>'+
      '<div class="spacer"></div>'+
      '<div class="mcap"><span class="mv">'+d.mcap_disp+'</span><span class="ms">涨 '+upn+' 家 · 跌 '+dwn+' 家</span></div>'+
      '<div class="price"><span class="val">'+d.price+'</span><span class="chg '+d.dir+'">'+d.chg+'</span></div>';
    // 点击跳转到板块详情页(传递板块代码与名称, 列出该板块下全部个股)
    if(d.code){
      row.dataset.code = d.code;
      // 进入板块详情前保存列表状态, 返回时可回到当前页与滚动位置
      row.addEventListener('click', () => {
        saveListState();
        location.href = 'sector_detail.html?code=' + encodeURIComponent(d.code)
                      + '&name=' + encodeURIComponent(d.name || '');
      });
    }
    return row;
  }

  function showLoading(){
    list.innerHTML = '<div class="empty">加载中…</div>';
    meta.textContent = '';
    pager.innerHTML = '';
  }

  // ===== API 模式渲染(后端已排序+分页, 前端直接出图) =====
  function renderApi(data){
    const boards = data.boards || [];
    const total = data.total || 0;
    const cur = data.page || 1;
    const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
    list.innerHTML = '';
    if(total === 0){
      list.innerHTML = '<div class="empty">未找到匹配「'+ state.q +'」的板块</div>';
      meta.textContent = '共 0 个板块';
      pager.innerHTML = '';
      return;
    }
    const frag = document.createDocumentFragment();
    boards.forEach(d => frag.appendChild(buildRow(d)));
    list.appendChild(frag);
    meta.textContent = '共 ' + total + ' ' + UNIT[state.type] + '板块 · 第 ' + cur + ' / ' + totalPages + ' 页 · 每页 ' + PER_PAGE + ' 个';
    renderPager(totalPages, cur);
    restoreScrollOnce();   // 首屏渲染完成后恢复离开前的滚动位置
  }

  // ===== 兜底模式渲染(客户端过滤+排序+分页) =====
  function doFallbackRender(){
    mode = 'fallback';
    const rows = applySort(filtered());
    const totalPages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
    let pg = state.page;
    if(pg > totalPages) pg = totalPages;
    if(pg < 1) pg = 1;
    state.page = pg;
    list.innerHTML = '';
    if(rows.length === 0){
      list.innerHTML = '<div class="empty">未找到匹配「'+ state.q +'」的板块</div>';
      meta.textContent = '共 0 个板块';
      pager.innerHTML = '';
      return;
    }
    const start = (pg - 1) * PER_PAGE;
    const frag = document.createDocumentFragment();
    rows.slice(start, start + PER_PAGE).forEach(d => frag.appendChild(buildRow(d)));
    list.appendChild(frag);
    meta.textContent = '共 ' + rows.length + ' 个板块 · 第 ' + pg + ' / ' + totalPages + ' 页 · 每页 ' + PER_PAGE + ' 个 · 离线兜底';
    renderPager(totalPages, pg);
    restoreScrollOnce();   // 首屏渲染完成后恢复离开前的滚动位置
  }

  function useFallback(){
    if(fallbackAll){ doFallbackRender(); return; }
    fallbackAll = FALLBACK;
    doFallbackRender();
  }

  // ===== 统一入口: 优先走 API(真实数据动态返回) =====
  function load(){
    showLoading();
    const params = new URLSearchParams({
      type: state.type, sort: state.sort, order: state.order,
      page: state.page, pageSize: PER_PAGE, q: state.q,
    });
    fetch(API_URL + '?' + params.toString())
      .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => { mode = 'api'; renderApi(data); })
      .catch(err => { console.warn('API 不可用, 降级本地示例数据:', err); useFallback(); });
  }

  function goPage(p){
    state.page = p;
    if(mode === 'api') load();
    else doFallbackRender();
  }

  function renderPager(total, cur){
    pager.innerHTML = '';
    const mkBtn = (label, opts) => {
      opts = opts || {};
      const b = document.createElement('button');
      b.textContent = label;
      if(opts.active) b.classList.add('active');
      if(opts.disabled) b.disabled = true;
      if(opts.onClick) b.addEventListener('click', opts.onClick);
      return b;
    };

    pager.appendChild(mkBtn('‹ 上一页', {disabled: cur<=1, onClick: () => goPage(cur-1)}));

    // 页码窗口：总数 ≤7 全部展示，否则首尾 + 当前页邻域 + 省略号
    const win = [];
    if(total <= 7){
      for(let i=1;i<=total;i++) win.push(i);
    } else {
      win.push(1);
      if(cur > 3) win.push('...');
      const s = Math.max(2, cur-1), e = Math.min(total-1, cur+1);
      for(let i=s;i<=e;i++) win.push(i);
      if(cur < total-2) win.push('...');
      win.push(total);
    }
    win.forEach(p => {
      if(p === '...'){
        const gap = document.createElement('span');
        gap.className = 'page-gap';
        gap.textContent = '…';
        pager.appendChild(gap);
      } else {
        pager.appendChild(mkBtn(String(p), {active: p===cur, onClick: () => goPage(p)}));
      }
    });

    pager.appendChild(mkBtn('下一页 ›', {disabled: cur>=total, onClick: () => goPage(cur+1)}));

    // ===== 跳转到指定页组件 =====
    const jump = document.createElement('span');
    jump.className = 'jump';

    const jumpLabel = document.createElement('span');
    jumpLabel.className = 'jump-label';
    jumpLabel.textContent = '跳至';

    const jumpInput = document.createElement('input');
    jumpInput.className = 'jump-input';
    jumpInput.type = 'text';
    jumpInput.inputMode = 'numeric';
    jumpInput.placeholder = '页码';
    jumpInput.value = String(cur);
    jumpInput.setAttribute('aria-label', '跳转到指定页码');

    const jumpBtn = document.createElement('button');
    jumpBtn.className = 'jump-go';
    jumpBtn.textContent = '跳转';

    const jumpErr = document.createElement('span');
    jumpErr.className = 'jump-err';

    let errTimer = null;
    function showJumpErr(msg){
      jumpErr.textContent = msg;
      jumpInput.classList.add('invalid');
      if(errTimer) clearTimeout(errTimer);
      errTimer = setTimeout(() => { jumpErr.textContent = ''; jumpInput.classList.remove('invalid'); }, 2500);
    }
    function doJump(){
      const raw = jumpInput.value.trim();
      if(!/^[1-9]\d*$/.test(raw)){           // 仅接受正整数
        showJumpErr('请输入正整数页码');
        return;
      }
      const p = parseInt(raw, 10);
      if(p < 1 || p > total){                 // 超出有效页码范围
        showJumpErr('页码需在 1–' + total + ' 之间');
        return;
      }
      if(p === cur) return;                   // 已在目标页, 不重复刷新
      goPage(p);
    }
    jumpBtn.addEventListener('click', doJump);
    jumpInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); doJump(); } });
    jumpInput.addEventListener('input', e => { e.target.value = e.target.value.replace(/[^\d]/g, ''); }); // 实时过滤非数字

    jump.appendChild(jumpLabel);
    jump.appendChild(jumpInput);
    jump.appendChild(jumpBtn);
    jump.appendChild(jumpErr);
    pager.appendChild(jump);
  }

  // 切换板块类型: 重置分页并重新拉取(实时展示对应板块数据)
  typeSel.addEventListener('change', e => {
    state.type = e.target.value;
    state.page = 1;
    if(mode==='api') load(); else doFallbackRender();
  });

  // 搜索框防抖 300ms: 连续输入只在停顿后发一次请求(避免每键一次, 冷缓存时会叠加多轮全量拉取)
  let qTimer = null;
  q.addEventListener('input', e => {
    state.q = e.target.value; state.page = 1;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { if(mode==='api') load(); else doFallbackRender(); }, 300);
  });
  sortSel.addEventListener('change', e => {
    const v = e.target.value;                 // 形如 chg_desc
    state.sort = v;
    state.order = v.endsWith('_asc') ? 'asc' : 'desc';
    state.page = 1;
    if(mode==='api') load(); else doFallbackRender();
  });

  // ===== 启动: 默认展示「行业板块」数据 =====
  load();
</script>
</body>
</html>
