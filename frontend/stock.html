<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TradeAI · 股票</title>
<style>
  :root{
    --bg:#F5F5F7;          /* 页面浅灰 */
    --card:#FFFFFF;        /* 卡片白 */
    --ink:#1D1D1F;         /* 主文字 */
    --sub:#6E6E73;         /* 次要文字 */
    --muted:#86868B;       /* 辅助文字 */
    --blue:#0071E3;        /* 强调蓝 */
    --blue-soft:#EAF2FC;   /* 行业标签底色 */
    --blue-ink:#0071E3;    /* 行业标签文字 */
    --up:#D8392F;          /* 涨 红 */
    --down:#1AA05A;        /* 跌 绿 */
    --search-bg:#F5F7FA;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;justify-content:center;padding:48px 16px;
  }
  .page{
    width:100%;max-width:1200px;background:var(--card);
    border-radius:24px;padding:56px 48px;
  }
  .breadcrumb{font-size:14px;color:var(--muted);font-weight:500;margin-bottom:8px;}
  .title{font-size:36px;font-weight:700;letter-spacing:-0.5px;}
  .subtitle{font-size:16px;color:var(--sub);margin-top:8px;}
  .search{
    margin-top:28px;height:56px;border-radius:var(--radius);
    background:var(--search-bg);display:flex;align-items:center;gap:12px;
    padding:0 18px;border:1px solid transparent;transition:border-color .15s ease;
  }
  .search:focus-within{border-color:var(--blue);}
  .search svg{flex:0 0 auto;}
  .search input{
    flex:1;border:none;background:transparent;outline:none;
    font-size:16px;color:var(--ink);font-family:inherit;
  }
  .search input::placeholder{color:var(--muted);}
  .meta{font-size:14px;color:var(--muted);font-weight:500;margin:18px 0 14px;}
  /* F-01：?intent= 引导条（中性色，不使用警示配色，避免被误读成错误提示） */
  .intentbar{
    display:flex;align-items:flex-start;gap:12px;
    background:var(--blue-soft,#EAF2FC);border:1px solid #CFE3F8;border-radius:12px;
    padding:14px 16px;margin:-6px 0 16px;
  }
  .intentbar[hidden]{display:none;}
  .intentbar .ib-text{flex:1;font-size:14px;line-height:1.7;color:#0B4C8C;}
  .intentbar .ib-text b{font-weight:700;}
  .intentbar .ib-close{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:none;background:transparent;
    color:#0B4C8C;font-size:17px;line-height:1;cursor:pointer;font-family:inherit;opacity:.7;
  }
  .intentbar .ib-close:hover{opacity:1;}
  .sortbar{display:flex;align-items:center;gap:10px;margin-top:18px;}
  .sort-label{font-size:14px;color:var(--sub);font-weight:500;}
  .sort-sel{
    height:40px;border-radius:12px;border:1px solid #E2E2E7;background:#fff;
    font-size:14px;color:var(--ink);padding:0 12px;font-family:inherit;cursor:pointer;
  }
  .sort-sel:focus{outline:none;border-color:var(--blue);}
  .mcap{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:104px;}
  .mcap .mv{font-size:16px;font-weight:700;}
  .mcap .ms{font-size:12px;color:var(--muted);}
  .list{display:flex;flex-direction:column;gap:14px;}
  .row{
    display:flex;align-items:center;gap:16px;cursor:pointer;
    background:#F5F5F7;border-radius:var(--radius);padding: 18px 24px;
    transition:background .15s ease;
  }
  .row:hover{background:#ECECEF;}
  .co{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;min-width:200px;}
  .co .name{font-size:18px;font-weight:700;}
  .co .code{font-size:13px;color:var(--muted);}
  .tag{
    flex:0 0 auto;background:var(--blue-soft);color:var(--blue-ink);
    font-size:13px;font-weight:500;padding:4px 12px;border-radius:14px;
  }
  .spacer{flex:1 1 auto;}
  .price{display:flex;align-items:baseline;gap:12px;flex:0 0 auto;}
  .price .val{font-size:18px;font-weight:700;}
  .price .chg{font-size:14px;font-weight:600;}
  .chg.up{color:var(--up);}
  .chg.down{color:var(--down);}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:15px;}
  .empty .t{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .empty .d{font-size:14px;color:var(--sub);line-height:1.7;}
  .retry{
    margin-top:16px;height:38px;padding:0 20px;border:1px solid #E2E2E7;background:#fff;color:var(--ink);
    font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;font-family:inherit;transition:all .15s ease;
  }
  .retry:hover{border-color:var(--blue);color:var(--blue);}
  .pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:28px;flex-wrap:wrap;}
  .pager button{
    min-width:38px;height:36px;padding:0 12px;border:1px solid #E2E2E7;background:#fff;color:var(--ink);
    font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;transition:all .15s ease;font-family:inherit;
  }
  .pager button:hover:not(:disabled):not(.active){border-color:var(--blue);color:var(--blue);}
  .pager button.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .pager button:disabled{opacity:.45;cursor:not-allowed;}
  .pager .page-gap{color:var(--muted);padding:0 4px;font-size:14px;}
  .pager .page-info{font-size:14px;color:var(--muted);margin:0 4px;font-weight:600;}
  /* 跳转到指定页 */
  .jump{position:relative;display:inline-flex;align-items:center;gap:6px;margin-left:10px;}
  .jump-label{font-size:14px;color:var(--muted);font-weight:500;}
  .jump-input{
    width:56px;height:36px;border:1px solid #E2E2E7;background:#fff;color:var(--ink);
    font-size:14px;font-weight:600;border-radius:10px;padding:0 8px;text-align:center;
    font-family:inherit;box-sizing:border-box;transition:border-color .15s ease;
  }
  .jump-input:focus{outline:none;border-color:var(--blue);}
  .jump-input.invalid{border-color:var(--up);}
  .jump-go{
    min-width:38px;height:36px;padding:0 12px;border:1px solid #E2E2E7;background:#fff;color:var(--ink);
    font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;transition:all .15s ease;font-family:inherit;
  }
  .jump-go:hover{border-color:var(--blue);color:var(--blue);}
  .jump-err{
    position:absolute;top:100%;left:0;margin-top:4px;white-space:nowrap;
    font-size:13px;color:var(--up);font-weight:500;
  }
  @media (max-width:480px){
    body{padding:24px 12px;}
    .page{border-radius:20px;padding:32px 20px;}
    .title{font-size:28px;}
    .row{flex-wrap:wrap;gap:10px;padding:14px 16px;}
    .co{min-width:0;flex:1 1 100%;}
    .tag{order:3;}
    .price{order:2;margin-left:auto;}
    .spacer{display:none;}
    .mcap{order:5;align-items:flex-start;min-width:0;}
  }
</style>
</head>
<body>
  <div class="page" id="page">
    <a href="index.html" class="breadcrumb" style="display:inline-block;margin-bottom:12px;text-decoration:none;">← 返回首页</a>
    <div class="breadcrumb">TradeAI / 股票</div>
    <div class="title">股票</div>
    <div class="subtitle">搜索并关注你的标的</div>

    <div class="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="#86868B" stroke-width="2"/>
        <path d="M20 20L16.5 16.5" stroke="#86868B" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="q" type="text" placeholder="搜索股票名称、代码或行业…" autocomplete="off" />
    </div>

    <div class="sortbar">
      <span class="sort-label">排序</span>
      <select id="sortSel" class="sort-sel">
        <option value="mcap_desc">总市值（高→低）</option>
        <option value="mcap_asc">总市值（低→高）</option>
        <option value="fcap_desc">流通市值（高→低）</option>
        <option value="fcap_asc">流通市值（低→高）</option>
        <option value="chg_desc">涨跌幅（高→低）</option>
        <option value="chg_asc">涨跌幅（低→高）</option>
      </select>
    </div>

    <div class="meta" id="meta">共 6 只 · 支持模糊搜索</div>

    <!-- F-01 策略 B：带意图参数的引导条。首页卡片 3/4 描述的能力只能经详情页到达，
         而首页给不出 code —— 用本提示条说明「为什么带你来这里、下一步做什么」，
         避免「点了没反应 / 跳错页」被当成 bug。中性引导语，不使用警示色。 -->
    <div class="intentbar" id="intentBar" hidden>
      <span class="ib-text" id="intentText"></span>
      <button type="button" class="ib-close" id="intentClose" aria-label="关闭提示">×</button>
    </div>

    <div class="list" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>

<script src="js/list_state.js"></script>
<script>
  // ===== 配置 =====
  const PER_PAGE_DEFAULT = 6;         // 每页默认 6 支(从详情返回时按离开前的每页条数恢复)
  let PER_PAGE = PER_PAGE_DEFAULT;
  const API_URL = '/api/stocks';      // 方案 A: 同源后端代理(真实数据, 动态)
  const DATA_URL = 'data/stocks.json';// 仅当后端不可达时的离线兜底

  // 降级示例数据（兜底数据也加载失败时使用）
  const FALLBACK = [
    {name:"云启智能科技", code:"688001 · 沪", ind:"半导体",     price:"¥142.80", chg:"+3.20%", dir:"up",   chg_num:3.20,  mcap:1.20e11, mcap_disp:"1200.00亿", fcap:1.20e11, fcap_disp:"1200.00亿"},
    {name:"比亚迪",       code:"002594 · 深", ind:"汽车",       price:"¥256.30", chg:"-1.15%", dir:"down", chg_num:-1.15, mcap:7.50e11, mcap_disp:"7500.00亿", fcap:7.50e11, fcap_disp:"7500.00亿"},
    {name:"贵州茅台",     code:"600519 · 沪", ind:"食品饮料",   price:"¥1685.0", chg:"+0.85%", dir:"up",   chg_num:0.85,  mcap:2.10e12, mcap_disp:"2.10万亿",  fcap:2.10e12, fcap_disp:"2.10万亿"},
    {name:"宁德时代",     code:"300750 · 深", ind:"电力设备",   price:"¥218.50", chg:"+2.40%", dir:"up",   chg_num:2.40,  mcap:9.60e11, mcap_disp:"9600.00亿", fcap:9.60e11, fcap_disp:"9600.00亿"},
    {name:"中国平安",     code:"601318 · 沪", ind:"金融",       price:"¥48.90",  chg:"-0.60%", dir:"down", chg_num:-0.60, mcap:8.90e11, mcap_disp:"8900.00亿", fcap:8.90e11, fcap_disp:"8900.00亿"},
    {name:"药明康德",     code:"603259 · 沪", ind:"医药生物",   price:"¥78.60",  chg:"+1.10%", dir:"up",   chg_num:1.10,  mcap:2.30e11, mcap_disp:"2300.00亿", fcap:2.30e11, fcap_disp:"2300.00亿"},
  ];

  const list = document.getElementById('list');
  const meta = document.getElementById('meta');
  const q = document.getElementById('q');
  const pager = document.getElementById('pager');
  const sortSel = document.getElementById('sortSel');

  const state = { sort:'mcap_desc', order:'desc', page:1, q:'' };  // 排序默认总市值降序
  let mode = 'api';          // 'api' | 'fallback'
  let fallbackAll = null;    // 兜底全量数据(来自 data/stocks.json 或 FALLBACK)
  let fallbackUpdated = '';  // 快照生成时间(来自 stocks.json 的 updated 字段)

  // 最小转义：用于把用户输入(搜索词)与外部文本(错误原因)插入 innerHTML
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
    ));
  }

  // ===== 列表状态保持 =====
  // 从个股详情返回时恢复页码/每页条数/关键词/排序/滚动位置; 从菜单、搜索等
  // 其它入口进入时 ListState.load 返回 null, 保持默认第 1 页(见 js/list_state.js)。
  const RESTORE = (window.ListState && ListState.load('stock')) || null;
  let scrollRestored = false;
  if(RESTORE){
    if(RESTORE.sort) state.sort = RESTORE.sort;
    if(RESTORE.order) state.order = RESTORE.order;
    if(RESTORE.page) state.page = RESTORE.page;
    if(typeof RESTORE.q === 'string') state.q = RESTORE.q;
    const ps = Number(RESTORE.pageSize);
    if(ps >= 1 && ps <= 100) PER_PAGE = ps;
    if(sortSel) sortSel.value = state.sort;      // UI 与恢复后的状态保持一致
    if(q) q.value = state.q;
    ListState.cleanUrl();
  }
  // ===== URL 直达参数(?q=) =====
  // 首页全局搜索(F-02)「查看全部」跳转而来。注意: 全新导航**不会**走上面的
  // ListState.load —— 它只认「返回导航」(back_forward / ?restore=1, 见 list_state.js:isReturnNav),
  // 故必须单独读取, 否则搜索框空白、列表停在默认第 1 页。
  // 优先级: 返回导航(restore) > 直达参数(q) > 默认。
  if(!RESTORE){
    const _q = new URLSearchParams(location.search).get('q');
    if(_q && _q.trim()){
      state.q = _q.trim();
      if(q) q.value = state.q;
    }
  }

  // ===== F-01：?intent= 引导条 =====
  // 首页卡片 3/4 的能力都只能经个股详情页到达，而首页给不出 code —— 用引导条
  // 说明「为什么带你来这里」。白名单校验：仅 report / financials 生效，其余静默忽略
  // （外部链接拼错参数不应弹出无关提示，也不应报错）。
  const INTENT_TEXT = {
    report: '请先选择一只股票，进入详情页后点「<b>AI生成公司基本面分析报告</b>」即可生成投研报告，生成过的报告都会收进<b>报告库</b>。',
    financials: '请先选择一只股票，生成基本面报告后，可在报告内按 <b>年报 / 中报 / 单季度</b> 切换报表视图，并查看 <b>同比 / 环比</b> 指标。'
  };
  (function(){
    const bar = document.getElementById('intentBar');
    const txt = document.getElementById('intentText');
    const btn = document.getElementById('intentClose');
    if(!bar || !txt) return;
    const key = (new URLSearchParams(location.search).get('intent') || '').trim();
    const msg = INTENT_TEXT[key];
    if(!msg) return;                       // 非白名单 → 不显示、不报错
    txt.innerHTML = msg;                   // 文案是本地常量，不含用户输入
    bar.hidden = false;
    if(btn) btn.addEventListener('click', function(){ bar.hidden = true; });
  })();
  function snapshot(){
    return { sort: state.sort, order: state.order, page: state.page,
             q: state.q, pageSize: PER_PAGE, scrollY: window.scrollY };
  }
  function saveListState(){ if(window.ListState) ListState.save('stock', snapshot()); }
  // 兜底保存: 任何离开本页的导航(含浏览器后退/前进)都能带上最新状态
  window.addEventListener('pagehide', saveListState);
  function restoreScrollOnce(){
    if(scrollRestored || !RESTORE) return;
    scrollRestored = true;
    ListState.restoreScroll(RESTORE.scrollY);
  }

  // ===== 悬停预取: 预热个股详情所需的服务端缓存(/api/stock 个股快照 + /api/kline 日K) =====
  let _pfTimer = null, _pfCode = '';
  function prefetchDetail(code){
    if(!code || _pfCode === code) return;
    _pfCode = code;
    // 两个接口均命中服务端缓存后, 详情页对应请求只剩毫秒级; 重复预取被服务端缓存吸收
    fetch('/api/stock?code=' + encodeURIComponent(code)).catch(()=>{});
    fetch('/api/kline?code=' + encodeURIComponent(code) + '&klt=101&n=600').catch(()=>{});
  }

  function filtered(){
    const kw = state.q.trim().toLowerCase();
    const src = fallbackAll || [];
    if(!kw) return src;
    return src.filter(d =>
      d.name.toLowerCase().includes(kw) ||
      d.code.toLowerCase().includes(kw) ||
      (d.ind || '').toLowerCase().includes(kw)
    );
  }

  // ===== 排序（兜底模式用, 先排序、后分页） =====
  function cmpNum(x, y, desc){
    const xn = (x == null), yn = (y == null);
    if(xn && yn) return 0;
    if(xn) return 1;     // 缺失值恒排末尾
    if(yn) return -1;
    const d = x - y;
    return desc ? -d : d;
  }
  const SORTS = {
    mcap_desc: (a,b)=> cmpNum(a.mcap, b.mcap, true),
    mcap_asc:  (a,b)=> cmpNum(a.mcap, b.mcap, false),
    fcap_desc: (a,b)=> cmpNum(a.fcap, b.fcap, true),
    fcap_asc:  (a,b)=> cmpNum(a.fcap, b.fcap, false),
    chg_desc:  (a,b)=> cmpNum(a.chg_num, b.chg_num, true),
    chg_asc:   (a,b)=> cmpNum(a.chg_num, b.chg_num, false),
  };
  function applySort(arr){
    const fn = SORTS[state.sort] || SORTS.mcap_desc;
    return arr.slice().sort(fn);
  }

  function buildRow(d){
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<div class="co"><div class="name">'+d.name+'</div><div class="code">'+d.code+'</div></div>'+
      '<div class="tag">'+d.ind+'</div>'+
      '<div class="spacer"></div>'+
      '<div class="mcap"><span class="mv">'+d.mcap_disp+'</span><span class="ms">流通 '+d.fcap_disp+'</span></div>'+
      '<div class="price"><span class="val">'+d.price+'</span><span class="chg '+d.dir+'">'+d.chg+'</span></div>';
    // 点击跳转到个股详情页（传递个股代码参数）
    const code = (d.code || '').replace(/[^0-9]/g, '');
    if(code){
      row.dataset.code = code;
      // 悬停预取: 停留 200ms 即预热详情页所需接口(服务端均有缓存, 命中后点击进详情秒开);
      // 触屏设备不触发 mouseenter, 无副作用
      row.addEventListener('mouseenter', () => {
        clearTimeout(_pfTimer);
        _pfTimer = setTimeout(() => prefetchDetail(code), 200);
      });
      // 进入详情前保存列表状态, 返回时可回到当前页与滚动位置
      row.addEventListener('click', () => {
        saveListState();
        prefetchDetail(code);   // 点击时立即预取(不等 200ms), 与页面跳转并行
        location.href = 'stock_detail.html?code=' + encodeURIComponent(code);
      });
    }
    return row;
  }

  function showLoading(){
    list.innerHTML = '<div class="empty">加载中…</div>';
    meta.textContent = '';
    pager.innerHTML = '';
  }

  // 真正的「查无此标的」：仅在取数成功、且确实过滤不出结果时使用
  function renderNoMatch(){
    list.innerHTML = '<div class="empty">未找到匹配「'+ esc(state.q) +'」的标的</div>';
    meta.textContent = '共 0 只';
    pager.innerHTML = '';
  }

  // 非实时数据的来源标注：backup=备用实时源 / stale=内存旧缓存 / snapshot=离线快照。
  // 「让降级可见」——不要静默把过期数据当实时数据展示。
  function sourceNote(status, sourceUpdated){
    if(status === 'backup') return ' · 备用行情源';
    if(status !== 'stale' && status !== 'snapshot') return '';
    const label = (status === 'snapshot') ? '离线快照' : '非实时缓存';
    const t = String(sourceUpdated || '').slice(0, 16);
    return t ? (' · ' + label + ' · 数据时间 ' + esc(t)) : (' · ' + label);
  }

  // 行情源不可用：**不是**「未找到」，两者文案必须彻底分开。
  // 判据来自后端 data_status（见 server.py::get_market_data），前端不猜。
  function renderUnavailable(reason){
    list.innerHTML =
      '<div class="empty">' +
        '<div class="t">行情数据暂不可用</div>' +
        '<div class="d">全市场行情源当前无法连接，且本地也没有可用的离线快照，<br>' +
        '因此暂时取不到列表。<br>' +
        (reason ? '原因：' + esc(reason) + '<br>' : '') +
        '这不是「没有这只股票」，通常是数据源临时限流，稍后重试即可。</div>' +
        '<button class="retry" id="retryBtn">重新加载</button>' +
      '</div>';
    meta.textContent = '';
    pager.innerHTML = '';
    const b = document.getElementById('retryBtn');
    if(b) b.addEventListener('click', function(){ load(); });
  }

  // ===== API 模式渲染(后端已排序+分页, 前端直接出图) =====
  function renderApi(data){
    const status = data.data_status || 'ok';

    // 1) 行情源不可用 —— 绝不能复用「未找到匹配」文案
    if(status === 'unavailable'){ renderUnavailable(data.reason); return; }

    const stocks = data.stocks || [];
    const total = data.total || 0;
    const cur = data.page || 1;
    const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
    list.innerHTML = '';

    if(total === 0){
      // 2) 无关键词却为空 —— 后端已保证「取数成功必非空」，
      //    走到这里说明是非实时来源，交给本地快照兜底（见 loadFallbackData）。
      if(!state.q){ loadFallbackData(); return; }
      renderNoMatch();
      return;
    }
    const frag = document.createDocumentFragment();
    stocks.forEach(d => frag.appendChild(buildRow(d)));
    list.appendChild(frag);
    meta.textContent = '共 ' + total + ' 只 · 第 ' + cur + ' / ' + totalPages + ' 页 · 每页 ' + PER_PAGE + ' 支'
                     + sourceNote(status, data.source_updated);
    renderPager(totalPages, cur);
    restoreScrollOnce();   // 首屏渲染完成后恢复离开前的滚动位置
  }

  // ===== 兜底模式渲染(客户端过滤+排序+分页) =====
  function doFallbackRender(){
    mode = 'fallback';
    const rows = applySort(filtered());
    const totalPages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
    let pg = state.page;
    if(pg > totalPages) pg = totalPages;
    if(pg < 1) pg = 1;
    state.page = pg;
    list.innerHTML = '';
    if(rows.length === 0){
      list.innerHTML = '<div class="empty">未找到匹配「'+ esc(state.q) +'」的标的</div>';
      meta.textContent = '共 0 只';
      pager.innerHTML = '';
      return;
    }
    const start = (pg - 1) * PER_PAGE;
    const frag = document.createDocumentFragment();
    rows.slice(start, start + PER_PAGE).forEach(d => frag.appendChild(buildRow(d)));
    list.appendChild(frag);
    // 明确标注离线来源与快照日期：用户必须能分辨「实时」与「快照」
    meta.textContent = '共 ' + rows.length + ' 只 · 第 ' + pg + ' / ' + totalPages + ' 页 · 每页 ' + PER_PAGE + ' 支'
                     + (fallbackUpdated
                          ? ' · 离线快照 · 数据时间 ' + esc(fallbackUpdated.slice(0, 16))
                          : ' · 离线兜底');
    renderPager(totalPages, pg);
    restoreScrollOnce();
  }

  function loadFallbackData(){
    if(fallbackAll){ doFallbackRender(); return; }
    fetch(DATA_URL)
      .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(j => {
        fallbackAll = (j && Array.isArray(j.stocks) && j.stocks.length) ? j.stocks : FALLBACK;
        // 记录快照生成时间，用于向用户标注数据新鲜度（静默用旧数据是不可接受的）
        fallbackUpdated = (j && j.updated) ? String(j.updated) : '';
        doFallbackRender();
      })
      .catch(err => {
        console.warn('兜底数据也加载失败, 使用内置示例:', err);
        fallbackAll = FALLBACK;
        fallbackUpdated = '';
        doFallbackRender();
      });
  }

  // ===== 统一入口: 优先走 API(方案 A) =====
  function load(){
    showLoading();
    const params = new URLSearchParams({
      sort: state.sort, order: state.order, page: state.page, pageSize: PER_PAGE, q: state.q,
    });
    fetch(API_URL + '?' + params.toString())
      .then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => { mode = 'api'; renderApi(data); })
      .catch(err => { console.warn('API 不可用, 降级本地数据:', err); loadFallbackData(); });
  }

  function goPage(p){
    state.page = p;
    if(mode === 'api') load();
    else doFallbackRender();
  }

  function renderPager(total, cur){
    pager.innerHTML = '';
    const mkBtn = (label, opts) => {
      opts = opts || {};
      const b = document.createElement('button');
      b.textContent = label;
      if(opts.active) b.classList.add('active');
      if(opts.disabled) b.disabled = true;
      if(opts.onClick) b.addEventListener('click', opts.onClick);
      return b;
    };

    pager.appendChild(mkBtn('‹ 上一页', {disabled: cur<=1, onClick: () => goPage(cur-1)}));

    // 页码窗口：总数 ≤7 全部展示，否则首尾 + 当前页邻域 + 省略号
    const win = [];
    if(total <= 7){
      for(let i=1;i<=total;i++) win.push(i);
    } else {
      win.push(1);
      if(cur > 3) win.push('...');
      const s = Math.max(2, cur-1), e = Math.min(total-1, cur+1);
      for(let i=s;i<=e;i++) win.push(i);
      if(cur < total-2) win.push('...');
      win.push(total);
    }
    win.forEach(p => {
      if(p === '...'){
        const gap = document.createElement('span');
        gap.className = 'page-gap';
        gap.textContent = '…';
        pager.appendChild(gap);
      } else {
        pager.appendChild(mkBtn(String(p), {active: p===cur, onClick: () => goPage(p)}));
      }
    });

    pager.appendChild(mkBtn('下一页 ›', {disabled: cur>=total, onClick: () => goPage(cur+1)}));

    // ===== 跳转到指定页组件 =====
    const jump = document.createElement('span');
    jump.className = 'jump';

    const jumpLabel = document.createElement('span');
    jumpLabel.className = 'jump-label';
    jumpLabel.textContent = '跳至';

    const jumpInput = document.createElement('input');
    jumpInput.className = 'jump-input';
    jumpInput.type = 'text';
    jumpInput.inputMode = 'numeric';
    jumpInput.placeholder = '页码';
    jumpInput.value = String(cur);
    jumpInput.setAttribute('aria-label', '跳转到指定页码');

    const jumpBtn = document.createElement('button');
    jumpBtn.className = 'jump-go';
    jumpBtn.textContent = '跳转';

    const jumpErr = document.createElement('span');
    jumpErr.className = 'jump-err';

    let errTimer = null;
    function showJumpErr(msg){
      jumpErr.textContent = msg;
      jumpInput.classList.add('invalid');
      if(errTimer) clearTimeout(errTimer);
      errTimer = setTimeout(() => { jumpErr.textContent = ''; jumpInput.classList.remove('invalid'); }, 2500);
    }
    function doJump(){
      const raw = jumpInput.value.trim();
      if(!/^[1-9]\d*$/.test(raw)){           // 仅接受正整数
        showJumpErr('请输入正整数页码');
        return;
      }
      const p = parseInt(raw, 10);
      if(p < 1 || p > total){                 // 超出有效页码范围
        showJumpErr('页码需在 1–' + total + ' 之间');
        return;
      }
      if(p === cur) return;                   // 已在目标页, 不重复刷新
      goPage(p);
    }
    jumpBtn.addEventListener('click', doJump);
    jumpInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); doJump(); } });
    jumpInput.addEventListener('input', e => { e.target.value = e.target.value.replace(/[^\d]/g, ''); }); // 实时过滤非数字

    jump.appendChild(jumpLabel);
    jump.appendChild(jumpInput);
    jump.appendChild(jumpBtn);
    jump.appendChild(jumpErr);
    pager.appendChild(jump);
  }

  q.addEventListener('input', e => { state.q = e.target.value; state.page = 1; if(mode==='api') load(); else doFallbackRender(); });
  sortSel.addEventListener('change', e => {
    const v = e.target.value;                 // 形如 mcap_desc
    state.sort = v;
    state.order = v.endsWith('_asc') ? 'asc' : 'desc';
    state.page = 1;
    if(mode==='api') load(); else doFallbackRender();
  });

  // ===== 启动: 优先走 API(方案 A, 真实数据动态返回) =====
  load();
</script>
<!-- F-04 报告任务中心：本页可发起报告生成，故需要跑中任务的全局可见性（切页不失联） -->
<script src="js/task_center.js"></script>
</body>
