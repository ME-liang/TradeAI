<title>TradeAI · 登录（网页版）</title>
<style>
  /* ============ Design Tokens（与首页 / App 版登录一致） ============ */
  :root{
    --canvas:#F5F5F7;
    --surface:#FFFFFF;
    --ink:#1D1D1F;
    --ink-2:#6E6E73;
    --ink-3:#86868B;
    --accent:#0071E3;
    --accent-hover:#0077ED;
    --accent-soft:#EAF2FB;
    --field:#F5F7FA;
    --radius-card:24px;
    --radius-field:16px;
    --font-cn:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    --font-en:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Display",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--canvas);
    font-family:var(--font-en),var(--font-cn);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:48px 24px;
  }

  /* ============ 网页版：双栏登录卡 ============ */
  .card{
    width:980px;max-width:100%;min-height:600px;
    background:var(--surface);
    border-radius:var(--radius-card);
    display:flex;overflow:hidden;
  }

  /* ---- 左栏：品牌区 ---- */
  .brand-panel{
    flex:1.1;
    background:linear-gradient(160deg,#0071E3 0%,#005BB8 100%);
    color:#fff;
    padding:56px 48px;
    display:flex;flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .brand-panel .brand-row{display:flex;align-items:center;gap:14px}
  .brand-panel .logo{width:52px;height:52px;flex:none}
  .brand-name{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .brand-panel .tagline{margin-top:8px;font-size:14px;color:rgba(255,255,255,.75)}

  /* 品牌区装饰：上升趋势折线（呼应 LOGO） */
  .deco{position:absolute;left:0;right:0;bottom:0;opacity:.18;pointer-events:none}

  .features{margin-top:auto;position:relative;z-index:1}
  .feature{display:flex;align-items:flex-start;gap:12px;padding:14px 0}
  .feature + .feature{border-top:1px solid rgba(255,255,255,.14)}
  .feature .ico{
    flex:none;width:36px;height:36px;border-radius:10px;
    background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;
  }
  .feature .t1{font-size:15px;font-weight:600}
  .feature .t2{margin-top:2px;font-size:13px;color:rgba(255,255,255,.7)}

  /* ---- 右栏：表单区 ---- */
  .form-panel{
    flex:1;
    padding:64px 56px 44px;
    display:flex;flex-direction:column;justify-content:center;
    background:var(--surface);
  }
  .m-brand{display:none}   /* 移动端折叠时的品牌头 */

  .field{
    display:flex;align-items:center;gap:10px;
    height:56px;border-radius:var(--radius-field);
    background:var(--field);
    padding:0 18px;
    transition:box-shadow .2s ease,background .2s ease;
  }
  .field + .field{margin-top:14px}
  .field:focus-within{background:#fff;box-shadow:0 0 0 2px var(--accent)}
  .field svg{flex:none}
  .field input{
    flex:1;min-width:0;border:0;outline:0;background:transparent;
    font-size:16px;color:var(--ink);font-family:inherit;
  }
  .field input::placeholder{color:var(--ink-3)}
  .eye{
    flex:none;border:0;background:transparent;cursor:pointer;padding:4px;
    display:flex;align-items:center;border-radius:8px;
  }
  .eye:hover{background:#ECECEC}

  .options{
    margin-top:18px;display:flex;align-items:center;justify-content:space-between;
    font-size:14px;
  }
  .remember{display:flex;align-items:center;gap:8px;color:var(--ink-2);cursor:pointer;user-select:none}
  .remember input{display:none}
  .box{
    width:18px;height:18px;border-radius:6px;background:var(--field);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  .box svg{opacity:0;transition:opacity .15s ease}
  .remember input:checked + .box{background:var(--accent)}
  .remember input:checked + .box svg{opacity:1}
  .link{color:var(--accent);text-decoration:none;font-weight:500}
  .link:hover{text-decoration:underline}

  .submit{
    margin-top:26px;width:100%;height:56px;border:0;cursor:pointer;
    border-radius:28px;background:var(--accent);
    font-size:17px;font-weight:600;color:#fff;font-family:inherit;
    transition:background .15s ease,transform .1s ease;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .submit:hover{background:var(--accent-hover)}
  .submit:active{transform:scale(.985)}
  .submit:disabled{opacity:.7;cursor:default}
  .spinner{
    width:18px;height:18px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .7s linear infinite;display:none;
  }
  .submit.loading .spinner{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .error{
    margin-top:14px;font-size:13px;color:#D8392F;
    display:none;align-items:center;gap:6px;
  }
  .error.show{display:flex}

  .divider{
    margin:28px 0 0;display:flex;align-items:center;gap:14px;
    color:var(--ink-3);font-size:13px;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#E8E8ED}
  .register{margin-top:16px;font-size:14px;color:var(--ink-2);text-align:center}
  .register .link{font-weight:600}

  .foot{margin-top:32px;font-size:12px;color:var(--ink-3);text-align:center}
  .foot a{color:var(--ink-3);text-decoration:none;margin:0 6px}
  .foot a:hover{color:var(--ink-2)}

  /* ============ 响应式：≤880px 折叠为单栏（对齐 App 版行为） ============ */
  @media (max-width:880px){
    body{padding:0;align-items:stretch}
    .card{width:100%;min-height:100dvh;border-radius:0;flex-direction:column}
    .brand-panel{display:none}
    .form-panel{
      padding:max(72px,env(safe-area-inset-top)) 28px 40px;
      justify-content:center;
    }
    /* 移动端显示与 App 版一致的品牌头 */
    .m-brand{display:block;text-align:center;margin-bottom:44px}
    .m-brand .logo{width:72px;height:72px}
    .m-brand .brand-name{font-size:26px;margin-top:14px;color:var(--ink)}
    .m-brand .brand-name .ai{color:var(--accent)}
    .m-brand .tagline{margin-top:6px;font-size:14px;color:var(--ink-2)}
    .field{height:52px}
    .submit{height:52px;border-radius:26px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>

<script>
  // 密码可见性切换
  const pwd = document.getElementById('password');
  const eyeOpen  = '<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke="#86868B" stroke-width="2"/><circle cx="12" cy="12" r="2.8" stroke="#86868B" stroke-width="2"/>';
  const eyeClosed= '<path d="M3 4l18 16" stroke="#86868B" stroke-width="2" stroke-linecap="round"/><path d="M10.6 5.8A10.9 10.9 0 0 1 12 5.5c6.5 0 10 6.5 10 6.5a17 17 0 0 1-3.2 3.9M6.6 7.2A16 16 0 0 0 2 12s3.5 6.5 10 6.5c1.3 0 2.5-.2 3.6-.6" stroke="#86868B" stroke-width="2" stroke-linecap="round"/>';
  document.getElementById('eyeBtn').addEventListener('click', () => {
    const show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    document.getElementById('eyeIcon').innerHTML = show ? eyeClosed : eyeOpen;
  });

  // 表单校验 + 登录验证（阶段1: POST /api/auth/login, 验证通过跳转首页）
  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('error');
  const errText = document.getElementById('errorText');
  const btn = document.getElementById('submitBtn');
  const btnText = document.getElementById('submitText');

  function showError(msg){ errText.textContent = msg; errBox.classList.add('show'); }
  form.addEventListener('input', () => errBox.classList.remove('show'));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const acc = document.getElementById('account').value.trim();
    if(!acc){ return showError('请输入手机号或用户名'); }
    if(pwd.value.length < 6){ return showError('密码至少 6 位'); }

    btn.classList.add('loading'); btn.disabled = true; btnText.textContent = '登录中…';
    try{
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          account: acc,
          password: pwd.value,
          remember: document.getElementById('remember').checked
        })
      });
      const data = await res.json().catch(() => ({}));
      if(res.ok && data.ok){
        // 「记住我」只记住账号, 不存密码: 勾选时把账号存入 localStorage, 未勾选则清除
        try{
          if(document.getElementById('remember').checked){
            localStorage.setItem('ta_remember_account', acc);
          }else{
            localStorage.removeItem('ta_remember_account');
          }
        }catch(e){/* 隐私模式等 localStorage 不可用: 忽略, 不影响登录 */}
        toast('登录成功，正在进入首页…');
        // AUTH-B: 登录前所在页由 ?next= 带回（仅允许同站相对路径, 防 Open Redirect）
        const _nxt = new URLSearchParams(location.search).get('next');
        const _dest = (_nxt && _nxt.startsWith('/') && !_nxt.startsWith('//'))
          ? _nxt : (data.redirect || '/index.html');
        setTimeout(() => { window.location.href = _dest; }, 400);
        return;  // 保持按钮禁用, 避免跳转前重复提交
      }
      btn.classList.remove('loading'); btn.disabled = false; btnText.textContent = '登录';
      showError(data.detail || ('登录失败(' + res.status + ')，请稍后重试'));
    }catch(err){
      btn.classList.remove('loading'); btn.disabled = false; btnText.textContent = '登录';
      showError('登录服务不可达，请确认后端服务已启动');
    }
  });

  // 「记住我」回填: 下次进入登录页自动填入上次勾选时用的账号(仅账号, 密码仍需输入)。
  // 另支持注册页跳转带参(?account=手机号&registered=1): 预填手机号并提示注册成功。
  // AUTH-B(2026-09-11): 已登录用户再访问登录页 → 经 /api/auth/me 判定后自动跳转
  // 首页(或 ?next= 指定的同站路径), 不再要求重复登录。
  (function prefillRemembered(){
    try{
      const params = new URLSearchParams(window.location.search);
      if(params.get('registered') === '1'){ toast('注册成功，请登录'); }
      const qAcc = params.get('account') || '';
      const saved = localStorage.getItem('ta_remember_account') || '';
      const acc = qAcc || saved;
      if(acc){ document.getElementById('account').value = acc; }
      if(saved && !qAcc){ document.getElementById('remember').checked = true; }
    }catch(e){/* localStorage 不可用: 跳过回填 */}

  // AUTH-B: 已登录访问登录页 → 自动跳首页(或 next); 未登录停留在本页
  (function(){
    try{
      const _nxt = new URLSearchParams(location.search).get('next');
      const _dest = (_nxt && _nxt.startsWith('/') && !_nxt.startsWith('//'))
        ? _nxt : '/index.html';
      fetch('/api/auth/me', {credentials: 'same-origin'})
        .then(r => { if(r.ok){ window.location.replace(_dest); } })
        .catch(() => {});
    }catch(e){}
  })();
  })();

  // 轻提示
  function toast(msg){
    let t = document.getElementById('toast');
    if(!t){
      t = document.createElement('div'); t.id = 'toast';
      t.style.cssText = 'position:fixed;left:50%;top:28px;transform:translateX(-50%);background:rgba(29,29,31,.9);color:#fff;font-size:14px;padding:10px 18px;border-radius:20px;z-index:99;transition:opacity .3s;font-family:inherit';
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._timer); t._timer = setTimeout(() => t.style.opacity = '0', 2200);
    return false;
  }
</script>
</body>
</html>
