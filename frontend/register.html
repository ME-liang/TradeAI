<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TradeAI · 注册</title>
<style>
  /* ============ Design Tokens（与登录页完全一致） ============ */
  :root{
    --canvas:#F5F5F7;
    --surface:#FFFFFF;
    --ink:#1D1D1F;
    --ink-2:#6E6E73;
    --ink-3:#86868B;
    --accent:#0071E3;
    --accent-hover:#0077ED;
    --accent-soft:#EAF2FB;
    --field:#F5F7FA;
    --danger:#D8392F;
    --radius-card:24px;
    --radius-field:16px;
    --font-cn:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    --font-en:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Display",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--canvas);
    font-family:var(--font-en),var(--font-cn);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:48px 24px;
  }

  /* ============ 双栏注册卡（与登录页同构） ============ */
  .card{
    width:980px;max-width:100%;min-height:600px;
    background:var(--surface);
    border-radius:var(--radius-card);
    display:flex;overflow:hidden;
  }

  /* ---- 左栏：品牌区（与登录页一致） ---- */
  .brand-panel{
    flex:1.1;
    background:linear-gradient(160deg,#0071E3 0%,#005BB8 100%);
    color:#fff;
    padding:56px 48px;
    display:flex;flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .brand-panel .brand-row{display:flex;align-items:center;gap:14px}
  .brand-panel .logo{width:52px;height:52px;flex:none}
  .brand-name{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .brand-panel .tagline{margin-top:8px;font-size:14px;color:rgba(255,255,255,.75)}
  .deco{position:absolute;left:0;right:0;bottom:0;opacity:.18;pointer-events:none}
  .features{margin-top:auto;position:relative;z-index:1}
  .feature{display:flex;align-items:flex-start;gap:12px;padding:14px 0}
  .feature + .feature{border-top:1px solid rgba(255,255,255,.14)}
  .feature .ico{
    flex:none;width:36px;height:36px;border-radius:10px;
    background:rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;
  }
  .feature .t1{font-size:15px;font-weight:600}
  .feature .t2{margin-top:2px;font-size:13px;color:rgba(255,255,255,.7)}

  /* ---- 右栏：表单区 ---- */
  .form-panel{
    flex:1;
    padding:56px 56px 40px;
    display:flex;flex-direction:column;justify-content:center;
    background:var(--surface);
  }
  .m-brand{display:none}   /* 移动端折叠时的品牌头 */

  .form-title{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .form-sub{margin-top:6px;font-size:14px;color:var(--ink-2)}

  .field{
    display:flex;align-items:center;gap:10px;
    height:56px;border-radius:var(--radius-field);
    background:var(--field);
    padding:0 18px;
    transition:box-shadow .2s ease,background .2s ease;
  }
  .field + .field, .hint + .field{margin-top:14px}
  .field:focus-within{background:#fff;box-shadow:0 0 0 2px var(--accent)}
  .field svg{flex:none}
  .field input{
    flex:1;min-width:0;border:0;outline:0;background:transparent;
    font-size:16px;color:var(--ink);font-family:inherit;
  }
  .field input::placeholder{color:var(--ink-3)}
  .eye{
    flex:none;border:0;background:transparent;cursor:pointer;padding:4px;
    display:flex;align-items:center;border-radius:8px;
  }
  .eye:hover{background:#ECECEC}

  /* 确认密码实时一致性提示 */
  .hint{
    display:none;margin-top:6px;padding-left:4px;
    font-size:12px;color:var(--danger);
    align-items:center;gap:5px;
  }
  .hint.show{display:flex}

  /* 图形验证码行 */
  .captcha-field input{letter-spacing:.08em;text-transform:uppercase}
  .captcha-img{
    flex:none;width:128px;height:42px;margin-left:4px;
    border-radius:8px;background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;
    box-shadow:inset 0 0 0 1px #E8E8ED;
  }
  .captcha-img:hover{box-shadow:inset 0 0 0 1px var(--accent)}
  .captcha-img svg{display:block}
  .captcha-img.loading{opacity:.5}

  .error{
    margin-top:14px;font-size:13px;color:var(--danger);
    display:none;align-items:center;gap:6px;
  }
  .error.show{display:flex}

  .submit{
    margin-top:22px;width:100%;height:56px;border:0;cursor:pointer;
    border-radius:28px;background:var(--accent);
    font-size:17px;font-weight:600;color:#fff;font-family:inherit;
    transition:background .15s ease,transform .1s ease;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .submit:hover{background:var(--accent-hover)}
  .submit:active{transform:scale(.985)}
  .submit:disabled{opacity:.7;cursor:default}
  .spinner{
    width:18px;height:18px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .7s linear infinite;display:none;
  }
  .submit.loading .spinner{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .divider{
    margin:26px 0 0;display:flex;align-items:center;gap:14px;
    color:var(--ink-3);font-size:13px;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#E8E8ED}
  .to-login{margin-top:16px;font-size:14px;color:var(--ink-2);text-align:center}
  .link{color:var(--accent);text-decoration:none;font-weight:500}
  .link:hover{text-decoration:underline}
  .to-login .link{font-weight:600}

  .foot{margin-top:30px;font-size:12px;color:var(--ink-3);text-align:center}
  .foot a{color:var(--ink-3);text-decoration:none;margin:0 6px}
  .foot a:hover{color:var(--ink-2)}

  /* ============ 响应式：≤880px 折叠为单栏（对齐登录页） ============ */
  @media (max-width:880px){
    body{padding:0;align-items:stretch}
    .card{width:100%;min-height:100dvh;border-radius:0;flex-direction:column}
    .brand-panel{display:none}
    .form-panel{
      padding:max(64px,env(safe-area-inset-top)) 28px 40px;
      justify-content:center;
    }
    .m-brand{display:block;text-align:center;margin-bottom:36px}
    .m-brand .logo{width:64px;height:64px}
    .m-brand .brand-name{font-size:26px;margin-top:12px;color:var(--ink)}
    .m-brand .brand-name .ai{color:var(--accent)}
    .m-brand .tagline{margin-top:6px;font-size:14px;color:var(--ink-2)}
    .field{height:52px}
    .submit{height:52px;border-radius:26px}
    .captcha-img{width:112px;height:40px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<main class="card">

  <!-- ============ 左栏：品牌展示（与登录页一致） ============ -->
  <section class="brand-panel">
    <div class="brand-row">
      <svg class="logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="TradeAI Logo">
        <rect x="0" y="0" width="120" height="120" rx="28" fill="#FFFFFF"/>
        <path d="M30 84 L52 66 L72 74 L92 44" stroke="#0071E3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="92" cy="44" r="7" fill="#0071E3"/>
      </svg>
      <div>
        <div class="brand-name">TradeAI</div>
        <div class="tagline">AI 驱动的交易分析平台</div>
      </div>
    </div>

    <svg class="deco" viewBox="0 0 460 260" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M0 220 L90 180 L170 196 L260 120 L340 140 L460 40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="460" cy="40" r="6" fill="#FFFFFF"/>
    </svg>

    <div class="features">
      <div class="feature">
        <span class="ico">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 18 L10 12 L14 14 L20 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div><div class="t1">智能 K 线分析</div><div class="t2">MA / BOLL / MACD 一键解读</div></div>
      </div>
      <div class="feature">
        <span class="ico">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="4" width="16" height="16" rx="3" stroke="#fff" stroke-width="2"/>
            <path d="M8.5 14.5 11 11l2 2 2.5-3.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div><div class="t1">基本面深度报告</div><div class="t2">财务 / 盈利 / 成长多维评估</div></div>
      </div>
      <div class="feature">
        <span class="ico">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="12" width="4" height="8" rx="1.2" fill="#fff"/>
            <rect x="10" y="8" width="4" height="12" rx="1.2" fill="#fff"/>
            <rect x="16" y="4" width="4" height="16" rx="1.2" fill="#fff"/>
          </svg>
        </span>
        <div><div class="t1">行业对标洞察</div><div class="t2">企业与行业基准全景对比</div></div>
      </div>
    </div>
  </section>

  <!-- ============ 右栏：注册表单 ============ -->
  <section class="form-panel">
    <!-- 移动端折叠后的品牌头（与登录页一致） -->
    <div class="m-brand">
      <svg class="logo" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="TradeAI Logo">
        <rect x="0" y="0" width="120" height="120" rx="28" fill="#0071E3"/>
        <path d="M30 84 L52 66 L72 74 L92 44" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="92" cy="44" r="7" fill="#FFFFFF"/>
      </svg>
      <div class="brand-name">Trade<span class="ai">AI</span></div>
      <div class="tagline">AI 驱动的交易分析平台</div>
    </div>

    <div class="form-title">创建账号</div>
    <div class="form-sub">注册即代表同意服务条款与隐私政策</div>

    <form id="registerForm" novalidate style="margin-top:30px">
      <!-- 手机号 -->
      <div class="field">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="2.5" width="12" height="19" rx="3" stroke="#86868B" stroke-width="2"/>
          <path d="M10.5 18.5h3" stroke="#86868B" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="phone" type="text" placeholder="手机号" inputmode="numeric" maxlength="11" autocomplete="tel" required>
      </div>

      <!-- 密码 -->
      <div class="field">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="10" width="16" height="10" rx="3" stroke="#86868B" stroke-width="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#86868B" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="password" type="password" placeholder="设置密码" autocomplete="new-password" required>
        <button class="eye" type="button" data-target="password" aria-label="显示或隐藏密码">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke="#86868B" stroke-width="2"/>
            <circle cx="12" cy="12" r="2.8" stroke="#86868B" stroke-width="2"/>
          </svg>
        </button>
      </div>

      <!-- 确认密码（实时一致性核对） -->
      <div class="field" style="margin-top:14px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="10" width="16" height="10" rx="3" stroke="#86868B" stroke-width="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#86868B" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="confirm" type="password" placeholder="确认密码" autocomplete="new-password" required>
        <button class="eye" type="button" data-target="confirm" aria-label="显示或隐藏确认密码">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke="#86868B" stroke-width="2"/>
            <circle cx="12" cy="12" r="2.8" stroke="#86868B" stroke-width="2"/>
          </svg>
        </button>
      </div>
      <p class="hint" id="confirmHint">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="#D8392F" stroke-width="2"/>
          <path d="M12 7.5v5.5" stroke="#D8392F" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="16.5" r="1.2" fill="#D8392F"/>
        </svg>
        两次输入的密码不一致
      </p>

      <!-- 图形验证码 -->
      <div class="field captcha-field" style="margin-top:14px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="4" width="18" height="14" rx="3" stroke="#86868B" stroke-width="2"/>
          <path d="M7 20h10" stroke="#86868B" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 9.5 10 12l-2 2.5M12.5 14.5h4" stroke="#86868B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input id="captchaText" type="text" placeholder="图形验证码" maxlength="4" autocomplete="off" required>
        <span class="captcha-img" id="captchaImg" title="看不清？点击刷新" role="button" aria-label="点击刷新图形验证码"></span>
      </div>

      <div class="error" id="error">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="#D8392F" stroke-width="2"/>
          <path d="M12 7.5v5.5" stroke="#D8392F" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="16.5" r="1.2" fill="#D8392F"/>
        </svg>
        <span id="errorText"></span>
      </div>

      <!-- 注册提交 -->
      <button class="submit" id="submitBtn" type="submit">
        <span class="spinner"></span><span id="submitText">注册</span>
      </button>
    </form>

    <div class="divider">或</div>
    <p class="to-login">已有账号？<a class="link" href="/login.html">直接登录</a></p>

    <p class="foot">
      <a href="#" onclick="return toast('服务条款占位')">服务条款</a>·<a href="#" onclick="return toast('隐私政策占位')">隐私政策</a>
      <br>2026 TradeAI 版权所有
    </p>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);
  const phoneEl = $('phone'), pwdEl = $('password'), confirmEl = $('confirm'),
        captchaTextEl = $('captchaText'), captchaImg = $('captchaImg'),
        form = $('registerForm'), errBox = $('error'), errText = $('errorText'),
        btn = $('submitBtn'), btnText = $('submitText'), confirmHint = $('confirmHint');
  let captchaId = '';

  function showError(msg){ errText.textContent = msg; errBox.classList.add('show'); }
  form.addEventListener('input', () => errBox.classList.remove('show'));

  // 轻提示
  function toast(msg){
    let t = document.getElementById('toast');
    if(!t){
      t = document.createElement('div'); t.id = 'toast';
      t.style.cssText = 'position:fixed;left:50%;top:28px;transform:translateX(-50%);background:rgba(29,29,31,.9);color:#fff;font-size:14px;padding:10px 18px;border-radius:20px;z-index:99;transition:opacity .3s;font-family:inherit';
      document.body.appendChild(t);
    }
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._timer); t._timer = setTimeout(() => t.style.opacity = '0', 2200);
    return false;
  }

  // ===== 图形验证码: 加载 / 点击刷新 =====
  async function loadCaptcha(){
    captchaImg.classList.add('loading');
    try{
      const res = await fetch('/api/auth/captcha', {cache: 'no-store'});
      const data = await res.json();
      captchaId = data.captcha_id || '';
      captchaImg.innerHTML = data.svg || '';
    }catch(e){
      captchaImg.innerHTML = '<span style="font-size:11px;color:#86868B">加载失败</span>';
    }finally{
      captchaImg.classList.remove('loading');
    }
  }
  captchaImg.addEventListener('click', () => { captchaTextEl.value = ''; loadCaptcha(); });

  // ===== 密码可见性切换(两个密码框通用) =====
  const eyeOpen  = '<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke="#86868B" stroke-width="2"/><circle cx="12" cy="12" r="2.8" stroke="#86868B" stroke-width="2"/>';
  const eyeClosed= '<path d="M3 4l18 16" stroke="#86868B" stroke-width="2" stroke-linecap="round"/><path d="M10.6 5.8A10.9 10.9 0 0 1 12 5.5c6.5 0 10 6.5 10 6.5a17 17 0 0 1-3.2 3.9M6.6 7.2A16 16 0 0 0 2 12s3.5 6.5 10 6.5c1.3 0 2.5-.2 3.6-.6" stroke="#86868B" stroke-width="2" stroke-linecap="round"/>';
  document.querySelectorAll('.eye').forEach(btnEye => {
    btnEye.addEventListener('click', () => {
      const input = document.getElementById(btnEye.dataset.target);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btnEye.querySelector('svg path') && (btnEye.querySelector('svg').innerHTML = show ? eyeClosed : eyeOpen);
    });
  });

  // ===== 确认密码: 实时一致性核对 =====
  function checkConfirm(){
    if(confirmEl.value && confirmEl.value !== pwdEl.value){
      confirmHint.classList.add('show');
    }else{
      confirmHint.classList.remove('show');
    }
  }
  pwdEl.addEventListener('input', checkConfirm);
  confirmEl.addEventListener('input', checkConfirm);

  // ===== 提交: 完整校验通过才请求后端 =====
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const phone = phoneEl.value.trim();
    // 1) 手机号格式
    if(!phone){ return showError('请输入手机号'); }
    if(!/^1\d{10}$/.test(phone)){ return showError('手机号格式不正确，请输入 1 开头的 11 位号码'); }
    // 2) 密码非空(按需求不做强度/长度校验)
    if(!pwdEl.value){ return showError('请设置密码'); }
    // 3) 两次密码一致
    if(confirmEl.value !== pwdEl.value){
      confirmHint.classList.add('show');
      return showError('两次输入的密码不一致，请检查后重试');
    }
    // 4) 图形验证码
    if(!captchaTextEl.value.trim()){ return showError('请输入图形验证码'); }
    if(captchaTextEl.value.trim().length !== 4){ return showError('图形验证码为 4 位字符，请核对后重试'); }

    btn.classList.add('loading'); btn.disabled = true; btnText.textContent = '注册中…';
    try{
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          phone: phone,
          password: pwdEl.value,
          captcha_id: captchaId,
          captcha_text: captchaTextEl.value.trim()
        })
      });
      const data = await res.json().catch(() => ({}));
      if(res.ok && data.ok){
        toast('注册成功，正在前往登录…');
        setTimeout(() => { window.location.href = data.redirect || '/login.html'; }, 500);
        return;  // 保持按钮禁用, 避免跳转前重复提交
      }
      btn.classList.remove('loading'); btn.disabled = false; btnText.textContent = '注册';
      showError(data.detail || ('注册失败(' + res.status + ')，请稍后重试'));
      // 验证码错误(或已被消费)→ 换一张并清空输入, 提示重新输入
      if(data.captcha_failed){
        captchaTextEl.value = '';
        loadCaptcha();
      }
    }catch(err){
      btn.classList.remove('loading'); btn.disabled = false; btnText.textContent = '注册';
      showError('注册服务不可达，请确认后端服务已启动');
    }
  });

  // 支持从登录页带参跳入时预填手机号
  try{
    const qAcc = new URLSearchParams(window.location.search).get('account');
    if(qAcc){ phoneEl.value = qAcc; }
  }catch(e){/* ignore */}

  loadCaptcha();
</script>
</body>
</html>
